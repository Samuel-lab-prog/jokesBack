services:
  - type: web
    name: piada-deploy-api
    runtime: node
    buildCommand: bun install --frozen-lockfile && bunx prisma generate && bun run build
    startCommand: bunx prisma migrate deploy && bun run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: piada-deploy-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
databases:
  - name: piada-deploy-db
    databaseName: piada_deploy
    user: piada_deploy
