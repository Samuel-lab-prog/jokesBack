services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: piada
      POSTGRES_PASSWORD: local-dev-password
      POSTGRES_DB: piada_deploy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piada -d piada_deploy"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://piada:local-dev-password@db:5432/piada_deploy?schema=public
      JWT_SECRET: local-dev-secret-change-this-32chars
      FRONTEND_URL: http://localhost:8080
    ports:
      - "3000:3000"

volumes:
  postgres_data:
